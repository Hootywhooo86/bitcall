<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitcall — 128bit Phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; image-rendering:pixelated; }
  body {
    background:#0d0d1a; color:#f5f5f5;
    font-family:'Press Start 2P', monospace;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:32px 16px;
  }
  .scanlines::after {
    content:""; position:fixed; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 2px, transparent 2px 4px);
  }
  .badge {
    font-size:10px; color:#ff9f1c; border:3px solid #ff9f1c;
    padding:8px 12px; margin-bottom:24px; letter-spacing:1px;
  }
  h1 { font-size:clamp(28px, 8vw, 56px); color:#b388ff; text-shadow:4px 4px 0 #4a148c; margin-bottom:8px; }
  .tagline { font-size:11px; color:#9e9e9e; margin-bottom:32px; text-align:center; line-height:1.8; }
  .phone {
    width:280px; background:#1a1a2e; border:6px solid #3d3d5c;
    border-radius:18px; padding:20px 16px 24px;
    box-shadow:0 0 0 6px #0d0d1a, 0 0 40px rgba(179,136,255,.25);
  }
  .screen {
    background:#101024; border:4px solid #3d3d5c; border-radius:8px;
    padding:16px 12px; margin-bottom:16px; min-height:120px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  }
  .number { font-size:18px; color:#b388ff; letter-spacing:2px; min-height:24px; }
  .call-btn {
    font-family:'Press Start 2P',monospace; font-size:11px;
    background:#00e676; color:#0d0d1a; border:0; border-radius:8px;
    padding:12px 20px; cursor:pointer; box-shadow:0 4px 0 #00a152;
  }
  .call-btn:active { transform:translateY(4px); box-shadow:none; }
  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .key {
    font-family:'Press Start 2P',monospace; font-size:14px;
    background:#2b2b45; color:#f5f5f5; border:0; border-radius:8px;
    padding:14px 0; cursor:pointer; box-shadow:0 4px 0 #17172a;
  }
  .key:active { transform:translateY(4px); box-shadow:none; background:#b388ff; color:#0d0d1a; }
  .key small { display:block; font-size:7px; color:#9e9e9e; margin-top:4px; }
  .key:active small { color:#0d0d1a; }
  .soon {
    margin-top:32px; font-size:11px; color:#ff9f1c; text-align:center; line-height:2;
    border:3px dashed #ff9f1c; padding:16px 20px; max-width:420px;
  }
  .waitlist { margin-top:24px; max-width:420px; width:100%; text-align:center; }
  .waitlist p { font-size:10px; color:#9e9e9e; margin-bottom:12px; line-height:1.8; }
  .waitlist form { display:flex; gap:8px; }
  .waitlist input {
    flex:1; font-family:'Press Start 2P',monospace; font-size:10px;
    background:#1a1a2e; border:3px solid #3d3d5c; color:#f5f5f5; padding:12px;
  }
  .waitlist button {
    font-family:'Press Start 2P',monospace; font-size:10px;
    background:#b388ff; color:#0d0d1a; border:0; padding:12px 16px; cursor:pointer;
    box-shadow:0 4px 0 #4a148c;
  }
  .waitlist button:active { transform:translateY(4px); box-shadow:none; }
  footer { margin-top:auto; padding-top:32px; font-size:8px; color:#55556e; text-align:center; line-height:2; }
  footer a { color:#b388ff; text-decoration:none; }
</style>
</head>
<body class="scanlines">
  <div class="badge">128BIT FAMILY</div>
  <h1>BITCALL</h1>
  <p class="tagline">the phone app, but chunkier.<br>dialing up soon.</p>

  <div class="phone">
    <div class="screen">
      <div class="number" id="number"></div>
      <button class="call-btn" onclick="ring()">&#9742; CALL</button>
    </div>
    <div class="pad" id="pad"></div>
  </div>

  <div class="soon">
    &#9888; COMING SOON &#9888;<br>
    <span style="color:#9e9e9e">we're wiring up the lines...</span>
  </div>

  <div class="waitlist">
    <p>want in when the lines open?<br>drop your email, we'll ring you.</p>
    <!-- TODO: replace with your Formspree endpoint, e.g. https://formspree.io/f/xxxxxx -->
    <form action="https://formspree.io/f/REPLACE_ME" method="POST">
      <input type="email" name="email" placeholder="you@email.com" required>
      <button type="submit">RING ME</button>
    </form>
  </div>

  <footer>
    a 128bit app by <a href="https://github.com/Hootywhooo86">Hootywhooo86</a><br>
    bitcall &bull; 128bit family
  </footer>

<script>
  const keys = [
    ['1',''], ['2','ABC'], ['3','DEF'],
    ['4','GHI'], ['5','JKL'], ['6','MNO'],
    ['7','PQRS'], ['8','TUV'], ['9','WXYZ'],
    ['*',''], ['0','+'], ['#','']
  ];
  const pad = document.getElementById('pad');
  const num = document.getElementById('number');
  keys.forEach(([d, sub]) => {
    const b = document.createElement('button');
    b.className = 'key';
    b.innerHTML = d + (sub ? `<small>${sub}</small>` : '');
    b.onclick = () => { if (num.textContent.length < 15) num.textContent += d; };
    pad.appendChild(b);
  });
  // tap the number to clear
  num.style.cursor = 'pointer';
  num.onclick = () => num.textContent = '';
  function ring() {
    if (!num.textContent) { num.textContent = 'NO NUMBER'; setTimeout(()=>num.textContent='', 900); return; }
    num.textContent = 'RINGING...';
    setTimeout(()=>num.textContent='', 1500);
  }
</script>
</body>
</html>
