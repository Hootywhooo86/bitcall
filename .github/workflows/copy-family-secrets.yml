name: One-time copy of family signing secrets to bitsports
on: workflow_dispatch
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy the four signing secrets into Hootywhooo86/bitsports
        env:
          GH_TOKEN: ${{ secrets.FAMILY_COPY_TOKEN }}
          KS: ${{ secrets.BITCALL_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.BITCALL_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.BITCALL_KEY_ALIAS }}
          KP: ${{ secrets.BITCALL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in GH_TOKEN KS KSP KA KP; do [ -n "${!v}" ] || { echo "Missing secret for $v"; exit 1; }; done
          printf '%s' "$KS"  | gh secret set FAMILY_KEYSTORE_BASE64   -R Hootywhooo86/bitsports
          printf '%s' "$KSP" | gh secret set FAMILY_KEYSTORE_PASSWORD -R Hootywhooo86/bitsports
          printf '%s' "$KA"  | gh secret set FAMILY_KEY_ALIAS         -R Hootywhooo86/bitsports
          printf '%s' "$KP"  | gh secret set FAMILY_KEY_PASSWORD      -R Hootywhooo86/bitsports
          echo "Copied 4 secrets."
