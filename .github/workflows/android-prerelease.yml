name: Android pre-release

# Builds the Bitcall APK, runs the unit tests, and publishes it as a GitHub *pre-release*.
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    paths: ["android/**", ".github/workflows/android-prerelease.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional but recommended: a stable signing key so pre-releases install as updates over each other.
      # Add repo secrets BITCALL_KEYSTORE_BASE64, BITCALL_KEYSTORE_PASSWORD, BITCALL_KEY_ALIAS, BITCALL_KEY_PASSWORD.
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.BITCALL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bitcall.jks"
            echo "BITCALL_KEYSTORE_PATH=$RUNNER_TEMP/bitcall.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set; APK is debug-signed and won't upgrade over a differently-signed install."
          fi

      - name: Test and build
        env:
          BITCALL_KEYSTORE_PASSWORD: ${{ secrets.BITCALL_KEYSTORE_PASSWORD }}
          BITCALL_KEY_ALIAS: ${{ secrets.BITCALL_KEY_ALIAS }}
          BITCALL_KEY_PASSWORD: ${{ secrets.BITCALL_KEY_PASSWORD }}
          BITCALL_VERSION_CODE: ${{ github.run_number }}
          BITCALL_VERSION_NAME: 0.1.${{ github.run_number }}-pre
        run: |
          ./gradlew testDebugUnitTest lintDebug assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "Bitcall-0.1.${{ github.run_number }}-pre.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: bitcall-apk
          path: android/Bitcall-*.apk

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.1.{0}-pre', github.run_number) }}
          name: Bitcall 0.1.${{ github.run_number }} (pre-release)
          prerelease: true
          files: android/Bitcall-*.apk
          body: |
            Pre-release build for testing. Install the APK on an Android 11+ phone, open Bitcall,
            and accept "Set as default phone app" when asked.
